<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web AR Tools - Studio</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        background: #0b1020;
        color: #e8ecff;
      }
      .wrap {
        max-width: 860px;
        margin: 40px auto;
        padding: 24px;
      }
      .card {
        background: #121a32;
        border: 1px solid #263056;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      h1 { margin-top: 0; font-size: 28px; }
      .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; }
      .ok { background: #173f2a; color: #98f5bc; }
      .warn { background: #3f3117; color: #ffd79a; }
      .err { background: #4a1f2a; color: #ffb0be; }
      code { background: #1a2448; padding: 2px 6px; border-radius: 6px; }
      ul { line-height: 1.8; }
      .btn {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 14px;
        border-radius: 8px;
        text-decoration: none;
        background: #375bff;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Web AR Tools – Studio Web</h1>
        <p>This is the GitHub Pages deployment with automatic AR capability fallback.</p>
        <div id="status"></div>
      </div>

      <div class="card">
        <h2>Mode</h2>
        <p id="mode">Detecting…</p>
        <button class="btn" id="startAr" disabled>Start AR Session</button>
      </div>

      <div class="card">
        <h2>Fallback 3D Viewer</h2>
        <p>If AR is unavailable on this device/browser, use fallback mode.</p>
        <ul>
          <li>Inspect models</li>
          <li>Basic transforms</li>
          <li>Measurement preview tools</li>
        </ul>
      </div>
    </div>

    <script>
      (async function detect() {
        const status = document.getElementById('status');
        const mode = document.getElementById('mode');
        const startAr = document.getElementById('startAr');

        const secure = window.isSecureContext;
        const hasXR = !!navigator.xr;

        let immersiveArSupported = false;
        if (hasXR && navigator.xr.isSessionSupported) {
          try {
            immersiveArSupported = await navigator.xr.isSessionSupported('immersive-ar');
          } catch (e) {
            immersiveArSupported = false;
          }
        }

        const bits = [];
        bits.push(`<span class="badge ${secure ? 'ok' : 'err'}">HTTPS Context: ${secure}</span>`);
        bits.push(`<span class="badge ${hasXR ? 'ok' : 'warn'}">navigator.xr: ${hasXR}</span>`);
        bits.push(`<span class="badge ${immersiveArSupported ? 'ok' : 'warn'}">immersive-ar: ${immersiveArSupported}</span>`);
        status.innerHTML = bits.join(' ');

        if (secure && hasXR && immersiveArSupported) {
          mode.textContent = 'AR mode available on this browser/device.';
          startAr.disabled = false;
          startAr.onclick = async () => {
            try {
              const session = await navigator.xr.requestSession('immersive-ar', {
                requiredFeatures: ['local-floor'],
                optionalFeatures: ['hit-test', 'anchors', 'hand-tracking']
              });
              mode.textContent = 'AR session started. Integrate renderer loop next.';
              session.addEventListener('end', () => {
                mode.textContent = 'AR session ended.';
              });
              await session.end();
            } catch (err) {
              mode.textContent = 'Failed to start AR session: ' + (err?.message || String(err));
            }
          };
        } else {
          mode.textContent = 'AR unavailable. Running in fallback 3D viewer mode.';
        }
      })();
    </script>
  </body>
</html>
